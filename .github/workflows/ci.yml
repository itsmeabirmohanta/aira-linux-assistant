name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libpulse0 libportaudio2 ffmpeg xvfb

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -r requirements.txt
          pip install pytest

      - name: Run Core Unit Tests
        run: |
          python -m pytest tests/test_agent.py

      - name: Run Offscreen GUI Layout & Vector Icon Tests
        run: |
          QT_QPA_PLATFORM=offscreen python tests/test_gui_instantiation.py

      - name: Run 8-Stage Standalone Workflow & ReAct Simulation
        run: |
          python tests/simulate_full_workflow.py
