[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-linux-agent"
version = "2.0.0"
description = "Autonomous Resident AI Agent for Linux desktops with multimodal vision, kernel input control, local voice transcription, and Swiss Modernism 2.0 interface."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["ai-agent", "linux", "desktop-automation", "wayland", "gemini", "vision", "react-agent", "dpdp", "whisper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Operating System",
]
dependencies = [
    "PyQt6>=6.6.0",
    "qasync>=0.27.0",
    "pynput>=1.7.6",
    "Pillow>=10.0.0",
    "google-genai>=0.1.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "playwright>=1.41.0",
    "chromadb>=0.4.22",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "faster-whisper>=1.0.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "httpx>=0.26.0",
]

[project.scripts]
aria = "aria.main:main"
aria-gui = "aria.gui.app:run_app"
aria-toggle = "aria.toggle:toggle"

[tool.setuptools.packages.find]
where = ["."]
include = ["aria*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py310"
